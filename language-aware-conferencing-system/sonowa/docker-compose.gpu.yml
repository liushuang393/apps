# GPU オーバーライド（NVIDIA Container Toolkit / Docker Desktop GPU 必須）
# 使い方:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# ローカル依存も入れる場合:
#   $env:INSTALL_LOCAL="1"; docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

services:
  backend:
    gpus: all
    environment:
      # エネルギー VAD は背景雑音で 8 秒強制切断・小音量で発話欠落を起こす（FLEURS 実測）。
      # ローカル構成は torch 同梱のため Silero を既定にする（.env / シェルで上書き可）。
      VAD_BACKEND: ${VAD_BACKEND:-silero}
    build:
      args:
        INSTALL_LOCAL: ${INSTALL_LOCAL:-1}
