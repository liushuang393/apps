# sonowa E2E メタ情報（init-app.py が生成、手動編集 OK）
# 再展開時は本ファイルの値を上書き優先（コマンド引数が無い場合）

[app]
name = "sonowa"
display_name = "Sonowa MVP"
# kind: "ui"（画面あり、testid/screenshot 点検対象）/ "api"（API のみ、UI 点検をスキップ）
kind = "ui"
target_dir = "e2e"
initialized_at = "2026-09-06T08:31:30Z"
kit_version = "0.3.0"

[adapter]
name = "python-react-fastapi"

[auth]
# 認証モード: real / api_key / none / login。内部 auth bypass は禁止
# Sonowa は JWT Bearer + zustand localStorage（sonowa-auth）。実ログイン必須。
mode = "login"

[browser]
surface = "browser"
base_url = "http://127.0.0.1:5273"
entry_routes = ["/"]
discovery_safe_routes = []
sensitive_env = []
allowed_origins = ["http://127.0.0.1:5273"]
# 実マイク / カメラ入力を使う業務なら true。adapter 側に media_capture capability を要求する。
media_capture = true
# 1 シナリオで同時に必要な参加者数。2 以上で multi_participant capability を要求する。
participants = 2
# identity_probe は削除済み。
# Sonowa は /__testing_kit_identity を持たない。疎通は backend GET /health を HEALTH-001 で確認する。

[data]
# fixture: scripts/seed.py + fixtures/scenarios、external: repo 内の外部 seed、
# self: spec が API/UI で自己準備、none: 静的 app 等で seed 不要
seed_mode = "self"
# seed の準備方法とは独立した保存先契約。DB snapshot/cleanup が必要な場合 true。
# existing-server + 共有 DB では wipe 禁止のため false。
requires_db = false
# seed_mode="external" のとき repo root からの相対 path を必須化
external_seed = ""

# existing-server: 既に localhost で動いている compose/dev を対象にする。
# Docker Desktop が使えない場合でも、5273/8090 が listen していれば A レーンが走る。
[deployment]
default_mode = "existing-server"
mode_env = "E2E_DEPLOYMENT_MODE"

[deployment.modes.existing-server]
start_server = false
run_global_setup = true
required_env = []

[deployment.modes.existing-server.env]
E2E_BASE_URL = "http://127.0.0.1:5273"
E2E_API_BASE_URL = "http://127.0.0.1:8090"

[ports]
frontend = 5273
api = 8090

[scenario_id]
# scope 内で一意の業務領域識別子（ID 採番用）
domains = ["AUTH", "ROOM", "LIVE", "SUBTITLE", "PREFERENCE", "ADMIN", "TRANSCRIPT", "QOS"]

[paths]
# repo root から見た相対パス
app_root = "."
frontend_root = "frontend"
backend_root = "backend"
app_config = "./app_config.json"
