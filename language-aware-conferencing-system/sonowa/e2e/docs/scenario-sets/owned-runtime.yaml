    {
      "id": "CERT-ROOM-CREATE",
      "description": "会議室の作成と永続化",
      "type": "regression",
      "priority": "P1",
      "execution_surface": "browser",
      "category": "normal",
      "route": "/rooms",
      "role": "user",
      "mutates_state": true,
      "preconditions": [
        "authenticated:user",
        "seeded:certification"
      ],
      "steps": [
        {
          "action": "navigate",
          "target": "/rooms"
        },
        {
          "action": "click",
          "target": "testid:room-create-open"
        },
        {
          "action": "fill",
          "target": "css:[data-testid=\"room-create-form\"] input[type=\"text\"]",
          "value": "Certification Room"
        },
        {
          "action": "click",
          "target": "testid:room-create-submit",
          "allowed_mutations": [
            {
              "method": "POST",
              "path": "/api/rooms",
              "max_count": 1
              }
          ]
        },
        {
          "action": "navigate",
          "target": "/rooms"
        },
        {
          "action": "observe_api",
          "target": "/api/rooms",
          "expected_status": 200
        }
      ],
      "expects": [
        "作成した会議室名が一覧に表示される",
        "同名の会議室が公開APIに保存される"
      ],
      "expected_result_bindings": [
        {
          "id": "RESULT-CERT-ROOM-CREATE-UI",
          "expect_index": 0,
          "expect_text": "作成した会議室名が一覧に表示される",
          "evidence": [
            {
              "id": "ASSERT-CERT-ROOM-CREATE-UI",
              "channel": "ui",
              "kind": "visible",
              "target": "text:Certification Room",
              "negative": false
            }
          ]
        },
        {
          "id": "RESULT-CERT-ROOM-CREATE-API",
          "expect_index": 1,
          "expect_text": "同名の会議室が公開APIに保存される",
          "evidence": [
            {
              "id": "ASSERT-CERT-ROOM-CREATE-API",
              "channel": "api",
              "kind": "json_array_contains",
              "method": "GET",
              "path": "/api/rooms",
              "expected_status": 200,
              "negative": false,
              "json_path": "rooms",
              "where": {
                "name": "Certification Room"
              }
            }
          ]
        }
      ],
      "expected_targets": [
        "text:Certification Room"
      ],
      "observation_channels": [
        "ui",
        "api"
      ],
      "business_patterns": [
        "BP-SONOWA-ROOM-CREATE"
      ]
    }
  ]
}
