# 本番フロント（docker-compose.prod.yml）: 静的配信 + /api と LiveKit(/rtc) の TLS 中継。
# 証明書は /etc/nginx/certs/tls.crt・tls.key（scripts/generate-tls-cert.sh）。

# HTTP は HTTPS へ転送する（マイク利用には安全なコンテキストが必須）。
server {
    listen 80;
    return 301 https://$host$request_uri;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # SPA ルーティング
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API（Docker 内部の backend:8000）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50m;
    }

    # LiveKit シグナリング（wss://<host>/rtc → livekit:7880）。メディアは UDP で直結する。
    location /rtc {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
