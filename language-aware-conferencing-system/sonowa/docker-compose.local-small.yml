# RTX 3060 12GB向けの2モデル検証用オーバーライド。
# Gemma ASR/MT + OmniVoice TTS。OmniVoiceの重みはCC-BY-NC。
# .envは変更せず、明示的にこのファイルを指定した環境だけに適用する。
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#   -f docker-compose.local-small.yml up -d --build
services:
  backend:
    image: sonowa-backend:local-small
    environment:
      LOCAL_TTS_MODEL: k2-fsa/OmniVoice
      VRAM_BUDGET_MB: "10000"
