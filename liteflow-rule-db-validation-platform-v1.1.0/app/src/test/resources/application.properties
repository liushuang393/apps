spring.application.name=liteflow-validation-platform-test
instance.id=test-executor
spring.datasource.url=jdbc:h2:mem:ruledb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
liteflow.rule-db.enabled=true
liteflow.rule-db.sql.auto-init-table=true
liteflow.rule-db.sync.poll-seconds=1
liteflow.rule-db.sync.reconcile-seconds=60
liteflow.metrics.enabled=true
spring.autoconfigure.exclude=com.yomahub.liteflow.springboot4.metrics.LiteflowMetricsAutoConfiguration
management.endpoints.web.exposure.include=health,prometheus,metrics

# ルール管理基盤（シナリオ#3）の自前テーブルを作る。
# LiteFlow は履歴を持たないため、履歴・差分・ロールバック・承認・監査は rm_* テーブルで自前に持つ。
# CREATE TABLE IF NOT EXISTS なので毎回実行しても安全。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# 管理画面と管理APIの利用者。PoC用の初期値であり本番利用は禁止。
admin.users.admin-password=${ADMIN_PASSWORD:admin123}
admin.users.approver-password=${APPROVER_PASSWORD:approver123}
admin.users.viewer-password=${VIEWER_PASSWORD:viewer123}
