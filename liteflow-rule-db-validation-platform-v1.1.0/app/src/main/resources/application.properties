spring.application.name=${SPRING_APPLICATION_NAME:liteflow-validation-platform}
server.port=${SERVER_PORT:8080}
instance.id=${INSTANCE_ID:local-executor}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/liteflow-rules;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

liteflow.rule-db.enabled=true
liteflow.rule-db.sql.auto-init-table=true
liteflow.rule-db.sync.poll-seconds=${RULE_DB_POLL_SECONDS:1}
liteflow.rule-db.sync.reconcile-seconds=${RULE_DB_RECONCILE_SECONDS:10}
liteflow.metrics.enabled=true

# liteflow-spring-boot4-starter:2.16.1 は -parameters 無しで公開されているため、その actuator
# @Endpoint は Spring Framework 7 上で起動できない。LiteflowMetricsConfig を参照のこと。
# メトリクスBeanは自前で再登録し、/actuator/liteflow は LiteflowMetaController が提供する。
spring.autoconfigure.exclude=com.yomahub.liteflow.springboot4.metrics.LiteflowMetricsAutoConfiguration

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.instance=${instance.id}
management.metrics.distribution.percentiles-histogram.liteflow.chain.executions=true
management.metrics.distribution.percentiles-histogram.liteflow.node.executions=true

info.app.name=LiteFlow Rule-DB Validation Platform
info.app.version=1.0.0
info.liteflow.version=2.16.1

# ルール管理基盤（シナリオ#3）の自前テーブルを作る。
# LiteFlow は履歴を持たないため、履歴・差分・ロールバック・承認・監査は rm_* テーブルで自前に持つ。
# CREATE TABLE IF NOT EXISTS なので毎回実行しても安全。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# 管理画面と管理APIの利用者。PoC用の初期値であり本番利用は禁止。
admin.users.admin-password=${ADMIN_PASSWORD:admin123}
admin.users.approver-password=${APPROVER_PASSWORD:approver123}
admin.users.viewer-password=${VIEWER_PASSWORD:viewer123}
